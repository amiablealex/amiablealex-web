<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ site.name }}{% endblock %}</title>
  <meta name="description" content="{% block description %}{{ site.description }}{% endblock %}">

  {# Open Graph / link previews #}
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ site.name }}">
  <meta property="og:title" content="{{ self.title() }}">
  <meta property="og:description" content="{{ self.description() }}">
  <meta property="og:url" content="{{ site.url }}{{ request.path }}">
  <meta property="og:image" content="{{ site.url }}{% block og_image %}{{ url_for('static', filename='img/og-image.png') }}{% endblock %}">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="{{ static_url('favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ static_url('css/style.css') }}">
  <link rel="stylesheet" href="{{ static_url('vendor/katex/katex.min.css') }}">
</head>
<body>
  {% from "_macros.html" import icon %}
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <a class="wordmark" href="{{ url_for('home') }}">amiable<span class="wordmark-accent">alex</span></a>
    <nav class="site-nav" aria-label="Primary">
      <a href="{{ url_for('projects') }}" {% if request.endpoint in ['projects','project_detail'] %}aria-current="page"{% endif %}>Projects</a>
      <a href="{{ url_for('about') }}" {% if request.endpoint == 'about' %}aria-current="page"{% endif %}>About</a>
      <a href="{{ url_for('contact') }}" {% if request.endpoint == 'contact' %}aria-current="page"{% endif %}>Contact</a>
      <span class="nav-social">
        <a href="{{ site.github }}" aria-label="GitHub" target="_blank" rel="noopener">{{ icon('brand-github') }}</a>
        <a href="{{ site.linkedin }}" aria-label="LinkedIn" target="_blank" rel="noopener">{{ icon('brand-linkedin') }}</a>
      </span>
    </nav>
  </header>

  <main id="main" class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <span class="footer-mark">amiablealex</span>
    <span class="footer-tagline">{{ site.tagline }}</span>
    <span class="footer-year">© {{ current_year }}</span>
  </footer>

  <script defer src="{{ static_url('vendor/katex/katex.min.js') }}"></script>
  <script defer src="{{ static_url('vendor/katex/contrib/auto-render.min.js') }}"
    onload="renderMathInElement(document.body, {
      delimiters: [
        {left: '\\[', right: '\\]', display: true},
        {left: '\\(', right: '\\)', display: false}
      ],
      throwOnError: false
    });"></script>

</body>
</html>
